services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: alphavoice-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: alphavoice
      POSTGRES_PASSWORD: ${ALPHAVOICE_POSTGRES_PASSWORD:?Set ALPHAVOICE_POSTGRES_PASSWORD before starting PostgreSQL}
      POSTGRES_DB: alphavoice

    ports:
      - "5432:5432"

    volumes:
      - alphavoice-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U alphavoice -d alphavoice"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  alphavoice-postgres-data: